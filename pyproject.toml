[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "change-delivery"
version = "0.2.0"
description = "Deterministic local delivery orchestrator for Codex"
requires-python = ">=3.12"
dependencies = [
  "filelock>=3.18,<4",
  "jsonschema>=4.23,<5",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
]

[project.scripts]
change-delivery = "change_delivery.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/change_delivery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
